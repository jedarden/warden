apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden
  namespace: warden
  labels:
    app: warden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warden
  template:
    metadata:
      labels:
        app: warden
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warden
          # Semver tag from the repo's VERSION file — never :latest, never a bare
          # digest/SHA (declarative-config/k8s/CLAUDE.md rule 8).
          image: ronaldraygun/warden:REPLACE_WITH_VERSION
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: warden-secrets   # WARDEN_SPOT_REFRESH_TOKEN, WARDEN_ORG_NAMESPACE, WARDEN_CALLER_TOKENS
          env:
            - name: WARDEN_MAX_TOTAL_NODES
              value: "10"
            - name: WARDEN_ALLOWED_SERVER_CLASSES
              value: "gp.vs1.medium-iad"
            - name: WARDEN_MAX_BID_PRICE
              value: "0.01"   # Spot raised the gp.vs1.medium floor to 0.01/hr (was 0.001); verified via serverclasses API 2026-07-27
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
