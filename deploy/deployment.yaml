apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden
  namespace: warden
  labels:
    app: warden
spec:
  replicas: 1
  # Old pod down before the new one starts: the Spot price guard must never
  # run as two instances (its state store would also refuse a second
  # writer). Not `type: Recreate`: ArgoCD's server-side apply cannot drop the
  # live object's defaulted rollingUpdate block, so the type change fails
  # validation (seen 2026-10-11) — maxSurge 0 / maxUnavailable 1 is the same
  # ordering for one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: warden
  template:
    metadata:
      labels:
        app: warden
    spec:
      # Own ServiceAccount: the price guard reads/writes its state ConfigMap
      # (spot-guard-rbac.yaml). Nothing else is granted.
      serviceAccountName: warden
      imagePullSecrets:
        - name: docker-hub-registry
      securityContext:
        runAsNonRoot: true
        # gcr.io/distroless/static:nonroot only declares a non-numeric "nonroot"
        # user in its image metadata; kubelet can't verify runAsNonRoot against
        # that without an explicit numeric UID. 65532 is that image's fixed UID.
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warden
          # Semver tag from the repo's VERSION file — never :latest, never a bare
          # digest/SHA (declarative-config/k8s/CLAUDE.md rule 8).
          image: ronaldraygun/warden:0.3.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: warden-spot-credentials   # WARDEN_SPOT_REFRESH_TOKEN
            - secretRef:
                name: warden-caller-tokens      # WARDEN_CALLER_TOKENS
            - secretRef:
                name: warden-spot-guard         # WARDEN_SPOT_REFRESH_TOKEN_APEXALGO, WARDEN_ALERT_NTFY_URL/_TOKEN
          env:
            - name: WARDEN_ORG_NAMESPACE
              # Not a secret — the dedicated apexalgo-agent org's namespace,
              # confirmed via the 2026-07-27 live-API probe.
              value: "org-knyiltp8zznvkz5g"
            - name: WARDEN_MAX_TOTAL_NODES
              value: "10"
            - name: WARDEN_ALLOWED_SERVER_CLASSES
              # Matches the real pool on the agent-sandbox cloudspace (us-central-ord-1),
              # NOT gp.vs1.medium-iad — see the class-mismatch note in project memory.
              value: "ch.vs1.large-ord"
            - name: WARDEN_MAX_BID_PRICE
              value: "0.01"   # Spot raised the gp.vs1.medium floor to 0.01/hr (was 0.001); verified via serverclasses API 2026-07-27
            - name: WARDEN_SPOT_GUARD_JSON
              # Spot price guard (warden docs/notes/spot-price-guard.md, bead
              # warden-faf60f86). User decision 2026-10-11: iad-ci
              # mh.vs1.large-iad pool, bid 0.015, off above 0.012/h, restore
              # after 30 min, max 2 nodes. The main org is NOT a caller target;
              # the guard's own permit covers only this pool and counts {0, 2}.
              # dryRun:false = writes enabled 2026-10-11 after the dry-run was verified
              # live (waiting-for-pool, ntfy delivery); set true to observe only.
              value: '{"account":"apexalgo","namespace":"org-kselolwaoxl3zxfm","refreshTokenEnv":"WARDEN_SPOT_REFRESH_TOKEN_APEXALGO","cloudSpace":"iad-ci","serverClass":"mh.vs1.large-iad","offAbovePerHour":"0.012","restoreAfter":"30m","restoreCount":2,"pollInterval":"60s","dryRun":false,"stateConfigMap":"warden-spot-guard-state"}'
          resources:
            # 64Mi/128Mi: rs-manager rule, limit at most 2x request (was
            # 32Mi/128Mi); the price guard adds one goroutine and small state.
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
