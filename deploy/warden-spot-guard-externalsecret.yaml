# Spot price guard inputs (docs/notes/spot-price-guard.md, bead warden-faf60f86),
# by reference only — no value ever appears in git.
#
# WARDEN_SPOT_REFRESH_TOKEN_APEXALGO — the MAIN-org (org-kselolwaoxl3zxfm)
#   refresh token at secret/rs-manager/rs-manager/rackspace-spot/apexalgo/api-key
#   (field `key`; the org claim of the identity it mints was verified to be the
#   main org on 2026-10-11). The guard alone uses it, through a Permit limited
#   to the iad-ci mh.vs1.large-iad pool and a count of 0 or 2. It is not a
#   caller target: callers cannot list or scale main-org pools.
# WARDEN_ALERT_NTFY_URL / _TOKEN — the existing ntfy paging topic, the same
#   path the cnpg-backup-watchdog and the rs-manager/iad-ci Alertmanagers use
#   (secret/rs-manager/iad-ci/cnpg-backup-watchdog). ntfy-token is empty today.
#
# Both paths sit under rs-manager/*, which the eso-rs-manager policy reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warden-spot-guard
  namespace: warden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: warden-spot-guard
    creationPolicy: Owner
  data:
    - secretKey: WARDEN_SPOT_REFRESH_TOKEN_APEXALGO
      remoteRef:
        key: rs-manager/rs-manager/rackspace-spot/apexalgo/api-key
        property: key
    - secretKey: WARDEN_ALERT_NTFY_URL
      remoteRef:
        key: rs-manager/iad-ci/cnpg-backup-watchdog
        property: ntfy-url
    - secretKey: WARDEN_ALERT_NTFY_TOKEN
      remoteRef:
        key: rs-manager/iad-ci/cnpg-backup-watchdog
        property: ntfy-token
