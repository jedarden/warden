# OpenBao path: secret/rs-manager/warden/caller-tokens
# Field: token — bearer token(s) for callers (autoscaler/dispatcher), comma-separated.
#
# POPULATED — verified 2026-08-23: this ExternalSecret reports SecretSynced=True
# and warden consumes it via envFrom, so /v1/pools authenticates. (The previous
# "NOT YET POPULATED" note here was stale and cost a round of re-diagnosis.)
#
# To rotate, pipe the new value in so it never enters argv:
#   openssl rand -hex 32 | bao kv put secret/rs-manager/warden/caller-tokens token=-
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warden-caller-tokens
  namespace: warden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: warden-caller-tokens
    creationPolicy: Owner
  data:
    - secretKey: WARDEN_CALLER_TOKENS
      remoteRef:
        key: rs-manager/warden/caller-tokens
        property: token
