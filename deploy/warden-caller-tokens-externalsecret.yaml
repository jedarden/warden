# OpenBao path: secret/rs-manager/warden/caller-tokens
# Field: token — bearer token(s) for callers (autoscaler/dispatcher), comma-separated.
#
# NOT YET POPULATED. Generate and store before this ExternalSecret can resolve:
#   bao kv put secret/rs-manager/warden/caller-tokens token="$(openssl rand -hex 32)"
# (run against rs-manager's OpenBao — see rs-manager/CLAUDE.md for the exec-into-pod
# pattern with the root token, or use a write-scoped token if one exists)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warden-caller-tokens
  namespace: warden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: warden-caller-tokens
    creationPolicy: Owner
  data:
    - secretKey: WARDEN_CALLER_TOKENS
      remoteRef:
        key: rs-manager/warden/caller-tokens
        property: token
