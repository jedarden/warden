# OpenBao path: secret/rs-manager/warden/caller-tokens
# Field: token — bearer token(s) for callers (autoscaler/dispatcher), comma-separated.
#
# POPULATED — verified 2026-08-23: this ExternalSecret reports SecretSynced=True
# and warden consumes it via envFrom, so /v1/pools authenticates. (The previous
# "NOT YET POPULATED" note here was stale and cost a round of re-diagnosis.)
# Re-verified 2026-09-17: SecretSynced=True, path at version 1.
#
# Provisioning, rotation, revocation, and rollback runbook — including the
# load-bearing pod restarts (warden reads WARDEN_CALLER_TOKENS once at start):
#   docs/notes/caller-token-provisioning.md
# A bare re-store is NOT a rotation; the one-liner below only stages the new
# allowlist in OpenBao, and the mount is cas_required (-cas is mandatory):
#   openssl rand -hex 32 | bao-as rs-manager-provision bao kv put -cas=<n> \
#     secret/rs-manager/warden/caller-tokens token=-
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warden-caller-tokens
  namespace: warden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: warden-caller-tokens
    creationPolicy: Owner
  data:
    - secretKey: WARDEN_CALLER_TOKENS
      remoteRef:
        key: rs-manager/warden/caller-tokens
        property: token
