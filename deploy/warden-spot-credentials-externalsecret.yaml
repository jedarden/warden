# OpenBao path: secret/rs-manager/warden/rackspace-spot/apexalgo-agent-organization
# Field: api-token — the dedicated apexalgo-agent org's Spot refresh token.
# Already populated (stored during the 2026-07-27 live-API probe).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warden-spot-credentials
  namespace: warden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: warden-spot-credentials
    creationPolicy: Owner
  data:
    - secretKey: WARDEN_SPOT_REFRESH_TOKEN
      remoteRef:
        key: rs-manager/warden/rackspace-spot/apexalgo-agent-organization
        property: api-token
