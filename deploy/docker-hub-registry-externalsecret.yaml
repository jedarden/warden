# Docker Hub registry credentials for pulling the private ronaldraygun/warden image.
#
# OpenBao path: secret/rs-manager/warden/docker/pull
# Stored fields:
#   username — Docker Hub username
#   PAT      — Personal Access Token (with read:packages scope)
#
# NOT YET POPULATED — matches the same credential used by every other
# ronaldraygun/* puller (see e.g. k8s/iad-options/options/docker-hub-registry-externalsecret.yml
# for the identical pattern at a different path). Populate with:
#   bao kv put secret/rs-manager/warden/docker/pull username="..." PAT="..."
#
# ESO templates these into a standard kubernetes.io/dockerconfigjson Secret
# named docker-hub-registry that the Deployment references via imagePullSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-hub-registry
  namespace: warden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: docker-hub-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .PAT }}","auth":"{{ printf "%s:%s" .username .PAT | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: rs-manager/warden/docker/pull
        property: username
    - secretKey: PAT
      remoteRef:
        key: rs-manager/warden/docker/pull
        property: PAT
