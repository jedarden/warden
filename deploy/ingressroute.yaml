# Tailnet-only exposure. vpn is the headscale/Tailscale-mesh entrypoint on
# rs-manager's Traefik — websecure would instead route through the Cloudflare
# tunnel and make this public, which warden must never be.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warden-tls
  namespace: warden
spec:
  secretName: warden-tls
  duration: 2160h
  renewBefore: 360h
  # letsencrypt-cloudflare is the issuer every other rs-manager vpn-entrypoint
  # service uses (argocd, openbao). This Certificate originally referenced
  # `ardenone-ca-issuer`, a ClusterIssuer that does not exist on rs-manager --
  # so it sat Ready=False / "Issuing certificate as Secret does not exist" from
  # 2026-07-30 to 2026-08-23 and Traefik served the route on its default cert.
  # Issuer fix verified live 2026-09-16: certificate warden-tls Ready=True.
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  commonName: "warden-rs-manager.ardenone.com"
  dnsNames:
    - "warden-rs-manager.ardenone.com"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: warden
  namespace: warden
spec:
  entryPoints:
    - vpn
  routes:
    - match: Host(`warden-rs-manager.ardenone.com`)
      kind: Rule
      services:
        - name: warden
          port: 80
  tls:
    secretName: warden-tls
