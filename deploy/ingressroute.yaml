# Tailnet-only exposure. vpn is the headscale/Tailscale-mesh entrypoint on
# rs-manager's Traefik — websecure would instead route through the Cloudflare
# tunnel and make this public, which warden must never be.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warden-tls
  namespace: warden
spec:
  secretName: warden-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: ardenone-ca-issuer
    kind: ClusterIssuer
  commonName: "warden-rs-manager.ardenone.com"
  dnsNames:
    - "warden-rs-manager.ardenone.com"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: warden
  namespace: warden
spec:
  entryPoints:
    - vpn
  routes:
    - match: Host(`warden-rs-manager.ardenone.com`)
      kind: Rule
      services:
        - name: warden
          port: 80
  tls:
    secretName: warden-tls
